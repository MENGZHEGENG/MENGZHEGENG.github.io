{% include base_path %}

<link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v={{ site.time | date: '%Y%m%d%H%M%S' }}" sizes="32x32">
<link rel="icon" href="{{ base_path }}/images/favicon.ico?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111a19" media="(prefers-color-scheme: dark)">
{% if jekyll.environment == "production" %}
<script defer src="https://statable.com/js/3386330/s.js"></script>
{% endif %}
