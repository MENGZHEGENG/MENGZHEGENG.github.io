- label: Accessible Speech AI
  heading: Inclusive speech recognition and adaptation
  description: Recognition and speaker adaptation for dysarthric and older-adult speech, with attention to severity, limited data, and privacy-preserving learning.
  color: "#006f5c"
  dark_color: "#69cdb5"
- label: Language Technology
  heading: Low-resource and multilingual language technology
  description: Speech recognition, synthesis, and language tools for under-resourced languages, including Indigenous language documentation, education, and multilingual processing.
  color: "#6c4f95"
  dark_color: "#c4a3f2"
- label: Speech Foundation Models
  heading: Adaptive and efficient speech models
  description: Evaluation, speaker-aware adaptation, and efficient deployment of pretrained speech models through prompting, compression, and quantization.
  color: "#276aa3"
  dark_color: "#83b6ed"
- label: Trustworthy Multimodal AI
  heading: Evidence-based evaluation of multimodal systems
  description: Evaluation of audio-conditioned visual prediction and multimodal decisions through input interventions, held-out task comparisons, endpoint controls, and abstention.
  color: "#a54d35"
  dark_color: "#f0997e"
- label: Speech Generation and Agents
  heading: Source-grounded generation and spoken agents
  description: Speech and audio generation, cross-lingual voice conversion, video-to-audio systems, and spoken agents that ground plans and actions in evidence.
  color: "#885e00"
  dark_color: "#dabf64"
- label: AI for Humanity
  heading: Interdisciplinary AI for people and society
  description: Interdisciplinary research connecting AI with linguistics, finance, psychology, media studies, neuroscience, and related fields to advance human understanding and societal well-being.
  color: "#a23b70"
  dark_color: "#eda3ca"
  show_in_publications: false
