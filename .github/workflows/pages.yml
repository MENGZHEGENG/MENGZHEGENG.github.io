name: Build and deploy academic website

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 4 * * *"
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check 12:10 a.m. ET schedule
        id: schedule-gate
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset="$(TZ=America/Toronto date +'%z')"
          if [[ "$SCHEDULE" == '10 4 * * *' && "$offset" == '-0400' ]] ||
             [[ "$SCHEDULE" == '10 5 * * *' && "$offset" == '-0500' ]]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the duplicate schedule for the other ET offset ($offset)."
          fi
      - name: Check out website
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        uses: actions/checkout@v4
      - name: Set up Ruby
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Check Google Scholar for new papers
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        run: python3 scripts/check_scholar_publications.py
      - name: Refresh Google Scholar metrics
        id: scholar-metrics
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        continue-on-error: true
        run: python3 scripts/fetch_scholar_metrics.py
      - name: Record Scholar metrics refresh warning
        if: steps.scholar-metrics.outcome == 'failure'
        run: |
          echo "::warning::Google Scholar metrics could not be refreshed; deploying the last saved metrics."
          {
            echo "### Google Scholar metrics refresh"
            echo
            echo "Google Scholar could not be reached during this run. The site will deploy with the last saved metrics."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check Statable API key availability
        id: statable-key
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        env:
          STATABLE_API_KEY: ${{ secrets.STATABLE_API_KEY }}
        run: |
          if [[ -n "$STATABLE_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh 30-day visitor count and country breakdown
        id: visitor-count
        if: (github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true') && steps.statable-key.outputs.configured == 'true'
        continue-on-error: true
        env:
          STATABLE_API_KEY: ${{ secrets.STATABLE_API_KEY }}
        run: python3 scripts/fetch_statable_visitor_count.py
      - name: Record visitor count refresh warning
        if: (github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true') && (steps.statable-key.outputs.configured != 'true' || steps.visitor-count.outcome == 'failure')
        run: |
          echo "::warning::Statable's 30-day visitor statistics were not refreshed during this run."
          {
            echo "### Visitor statistics refresh"
            echo
            echo "The 30-day visitor count and country breakdown could not be refreshed. The site will show unavailable states rather than stale values."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build Jekyll site
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Configure GitHub Pages
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.schedule-gate.outputs.run_refresh == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
