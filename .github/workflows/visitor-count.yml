name: Refresh visitor count

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: website-worker-deployment
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Skip delayed duplicate scheduled refreshes
        id: duplicate-check
        if: github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "visitor-count.yml",
                branch: context.ref_name,
                per_page: 100
              });
              const currentRun = data.workflow_runs.find(
                (run) => run.id === Number(context.runId)
              );
              if (!currentRun) {
                core.warning("Could not locate this run in the Actions API; continuing with the refresh.");
                core.setOutput("skip", "false");
                return;
              }

              const createdAt = new Date(currentRun.created_at);
              const scheduledSlot = new Date(createdAt);
              const minuteOffset = (createdAt.getUTCMinutes() - 7 + 10) % 10;
              scheduledSlot.setUTCMinutes(createdAt.getUTCMinutes() - minuteOffset, 0, 0);
              const coveredRun = data.workflow_runs.find(
                (run) => run.id !== currentRun.id &&
                  run.status === "completed" &&
                  run.conclusion === "success" &&
                  run.completed_at &&
                  Date.parse(run.completed_at) >= scheduledSlot.getTime()
              );

              if (coveredRun) {
                core.notice(`Skipping scheduled slot ${scheduledSlot.toISOString()}; run #${coveredRun.run_number} already refreshed successfully after it.`);
                core.setOutput("skip", "true");
              } else {
                core.setOutput("skip", "false");
              }
            } catch (error) {
              core.warning(`Could not check for a delayed duplicate (${error.message}); continuing with the refresh.`);
              core.setOutput("skip", "false");
            }
      - name: Check out website
        if: steps.duplicate-check.outputs.skip != 'true'
        uses: actions/checkout@v4
      - name: Check Cloudflare deployment settings
        if: steps.duplicate-check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret and CLOUDFLARE_ACCOUNT_ID repository variable before deploying."
            exit 1
          fi
      - name: Set up Ruby
        if: steps.duplicate-check.outputs.skip != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Refresh Statable 7-day and all-time visitor counts
        if: steps.duplicate-check.outputs.skip != 'true'
        env:
          STATABLE_API_KEY: ${{ secrets.STATABLE_API_KEY }}
        run: python3 scripts/fetch_statable_visitor_count.py
      - name: Build Jekyll site
        if: steps.duplicate-check.outputs.skip != 'true'
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Deploy country-aware site to Cloudflare Workers
        if: steps.duplicate-check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.165.0"
          quiet: true
